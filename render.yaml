# Render deployment configuration for AeroAtlas (Optimized for Render Free Tier)
# Blueprint specification: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: aeroatlas
    runtime: static
    # Command to build the static assets quickly without wasting free build minutes
    buildCommand: npm install --no-audit --prefer-offline && npm run build
    staticPublishPath: ./dist
    # Disable PR previews to conserve free tier monthly build minutes (500 min/month limit)
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22
    headers:
      # Aggressive caching for immutable hashed assets to conserve free bandwidth (100 GB/month limit)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Cache NASA datasets for 24 hours
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
    routes:
      # Single-page application (SPA) rewrite to index.html
      - type: rewrite
        source: /*
        destination: /index.html
